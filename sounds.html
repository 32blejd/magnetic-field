<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Magnetic Field – Sound board</title>
  <style>
    html, body { margin: 0; background: #04050c; color: #e6fbff; font: 13px Consolas, "Courier New", monospace; }
    main { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
    h1 { color: #00f0ff; font-size: 22px; margin: 0 0 4px; text-shadow: 0 0 12px rgba(0,240,255,.6); }
    p { color: #5f9bb3; margin: 0 0 18px; }
    h2 { color: #ff2bd6; font-size: 12px; letter-spacing: .08em; margin: 22px 0 8px; }
    .grid { display: flex; flex-wrap: wrap; gap: 8px; }
    button { background: #080c1e; color: #00f0ff; border: 1px solid rgba(0,240,255,.5); border-radius: 7px; padding: 8px 12px; font: inherit; cursor: pointer; }
    button:hover { background: rgba(0,240,255,.12); box-shadow: 0 0 10px rgba(0,240,255,.35); }
    label { display: inline-flex; align-items: center; gap: 8px; margin-right: 20px; color: #5f9bb3; }
    input[type=range] { accent-color: #00f0ff; }
  </style>
</head>
<body>
  <main>
    <h1>SOUND BOARD</h1>
    <p>Every sound effect of the game, synthesized live (src/audio/synth.ts). Click to play. Dev only – not part of the build.</p>
    <label>Volume <input id="vol" type="range" min="0" max="1" step="0.05" value="0.8"></label>
    <label>Combo (pickup pitch) <input id="combo" type="range" min="0" max="30" step="1" value="0"> <span id="comboVal">0</span></label>
    <div id="groups"></div>
  </main>
  <script type="module" src="/src/audio/soundboard.ts"></script>
</body>
</html>
