<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polarity Shift – UI Mockup</title>
<style>
  html, body { margin: 0; height: 100%; background: #04050c; color: #e6fbff; font: 13px Consolas, "Courier New", monospace; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; }
  nav { display: flex; gap: 8px; }
  nav button { background: #080c1e; color: #5f9bb3; border: 1px solid rgba(0,229,255,.35); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  nav button.on { color: #00f0ff; border-color: #00f0ff; box-shadow: 0 0 10px rgba(0,240,255,.4); }
  canvas { display: block; width: min(100vw, calc((100vh - 60px) * 16 / 9)); aspect-ratio: 16 / 9; }
</style>
</head>
<body>
<nav>
  <button data-s="progress">0 · Run (≥100k, tree preview)</button>
  <button data-s="ready">1 · Run ready (1M)</button>
  <button data-s="tree" class="on">2 · Core tree (spend Cores)</button>
  <button data-s="confirm">3 · Confirm</button>
</nav>
<canvas id="c"></canvas>
<script>
/* UI mockup only – not wired to the game. Logical view 960×540 like the game. */
const W = 960, H = 540, FONT = 'Consolas, "Courier New", monospace';
const C = { bg: '#04050c', panel: '#080c1e', cyan: '#00f0ff', magenta: '#ff2bd6', amber: '#ffc21a', green: '#4dff9a', red: '#ff3355', text: '#e6fbff', sub: '#5f9bb3', core: '#b98cff' };
/* Four branches on real compass directions: N up, E right, S down, W left. */
const POLE = { N: '#ff5147', E: C.amber, S: C.cyan, W: C.green, core: C.core }; // N red like a compass needle
const POLE_NAME = { N: 'N · ACTIVE PLAY', E: 'E · COINS & EVENTS', S: 'S · ECONOMY', W: 'W · AUTOMATION', core: 'POLARITY CORE' };
const POLE_SHORT = { N: 'Active play', E: 'Coins & events', S: 'Economy', W: 'Automation' };
/* unit vectors: [along the branch, sideways] */
const AXES = { N: [[0, -1], [1, 0]], E: [[1, 0], [0, 1]], S: [[0, 1], [-1, 0]], W: [[-1, 0], [0, -1]] };

const cv = document.getElementById('c'), dpr = Math.max(2, devicePixelRatio || 1);
cv.width = W * dpr; cv.height = H * dpr;
const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
const glow = (c, b) => { ctx.shadowColor = c; ctx.shadowBlur = b; }, noGlow = () => { ctx.shadowBlur = 0; };
function hex(x, y, r, rot = Math.PI / 6) { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = rot + i * Math.PI / 3; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); } ctx.closePath(); }
function wrap(text, w) { const out = []; let line = ''; for (const word of text.split(' ')) { const t = line ? line + ' ' + word : word; if (ctx.measureText(t).width > w && line) { out.push(line); line = word; } else line = t; } if (line) out.push(line); return out; }

/* ---------- Core tree data (draft) ----------
   Every branch uses the same 7-slot shape, rotated to its compass direction:
              b4
       b2 ─┤
   b1 ─┤    b5 ── key
       b3 ─┤
              b6                                                       */
const SLOTS = {
  b1: [115, 0, ['core']], b2: [205, -65, ['b1']], b3: [205, 65, ['b1']],
  b4: [300, -115, ['b2']], b5: [300, 0, ['b2', 'b3']], b6: [300, 115, ['b3']],
  key: [415, 0, ['b4', 'b5', 'b6']],
};
const VERTICAL_SQUEEZE = 0.72; // the view is wide, so N/S branches are a bit shorter than E/W
function branch(pole, defs) {
  const [u, v] = AXES[pole];
  return Object.entries(defs).map(([slot, d]) => {
    const [d0, side, from] = SLOTS[slot], dist = u[1] ? d0 * VERTICAL_SQUEEZE : d0;
    return { id: pole + slot, pole, x: u[0] * dist + v[0] * side, y: u[1] * dist + v[1] * side,
             from: from.map(f => (f === 'core' ? 'core' : pole + f)), key: slot === 'key', ...d };
  });
}
const NODES = [
  { id: 'core', pole: 'core', x: 0, y: 0, name: 'Polarity Core', icon: '◆', max: 1, cost: [0], key: true, desc: 'The heart of the tree. Every Core you have ever earned gives +2% coin value.' },
  ...branch('N', { // Active play – rewards skill (magenta)
    b1: { name: 'Charged Field', icon: 'R+', max: 3, cost: [1, 2, 3], desc: '+10% Range per level.' },
    b2: { name: 'Momentum', icon: '»R', max: 2, cost: [2, 4], desc: 'Moving the cursor fast widens the field: up to +15% range per level at full speed.' },
    b3: { name: 'Hot Streak', icon: 'C+', max: 2, cost: [2, 4], desc: 'Combo window +0.3 s per level.' },
    b4: { name: 'Combo Shield', icon: '⛉', max: 1, cost: [5], desc: "Once every 30 s, touching an anti-coin doesn't reset your combo." },
    b5: { name: 'Grounding', icon: '⏚', max: 2, cost: [3, 5], desc: 'Anti-coin short circuit −0.4 s per level.' },
    b6: { name: 'Combo Limit', icon: '×', max: 1, cost: [5], desc: 'Max combo multiplier ×2 → ×2.5.' },
    key: { name: 'Satellites', icon: '◎', max: 3, cost: [10, 15, 20], desc: 'KEYSTONE · A small magnet orbits your cursor (+1 per level).' },
  }),
  ...branch('E', { // Coins & events – rarer, richer coins and more events (amber)
    b1: { name: 'Lucky Charge', icon: '%', max: 3, cost: [2, 3, 4], desc: '+1% Gold and Prism chance per level.' },
    b2: { name: 'Prism Resonance', icon: '◇', max: 1, cost: [6], desc: 'Prism coins are worth ×4 instead of ×3.' },
    b3: { name: 'Storm Front', icon: '~', max: 2, cost: [2, 4], desc: 'Events happen 20% more often per level.' },
    b4: { name: 'Chain Reaction', icon: '⚡', max: 1, cost: [6], desc: 'Catching a Prism pulls in every coin within 80 px.' },
    b5: { name: 'Meteor Shower', icon: '☄', max: 1, cost: [5], desc: 'New event: a line of fast coins sweeps across the board from one edge.' },
    b6: { name: 'Golden Fountain', icon: '✺', max: 1, cost: [5], desc: 'Fountain events spray Gold coins only.' },
    key: { name: 'Void Coin', icon: '●', max: 1, cost: [15], desc: 'KEYSTONE · New coin tier: Void, ×10 value, 0.3% chance, phases through the field every other second.' },
  }),
  ...branch('S', { // Economy – more coins and more Cores (cyan)
    b1: { name: 'Dividend', icon: '$+', max: 5, cost: [1, 2, 3, 4, 5], desc: '+15% coin value per level.' },
    b2: { name: 'Head Start', icon: '▶$', max: 3, cost: [2, 4, 6], desc: 'Start each run with 500 / 5k / 50k coins.' },
    b3: { name: 'Discount', icon: '−%', max: 3, cost: [2, 4, 6], desc: 'Upgrades cost 8% less per level.' },
    b4: { name: 'Fast Track', icon: '»', max: 1, cost: [4], desc: 'Upgrades and features unlock at half the usual earnings.' },
    b5: { name: 'Compound', icon: '↗', max: 1, cost: [5], desc: '+1% coin value for every minute of the current run, up to +30%.' },
    b6: { name: 'Core Yield', icon: '◆+', max: 2, cost: [6, 10], desc: '+20% Cores from every shift per level.' },
    key: { name: 'Interest', icon: '%$', max: 1, cost: [14], desc: 'KEYSTONE · Every 10 s you gain 1% of the coins you hold (up to 1 minute of income).' },
  }),
  ...branch('W', { // Automation – the game plays itself more and more (green)
    b1: { name: 'Bulk Buy', icon: '≡', max: 1, cost: [1], desc: 'Shift + key/click buys as many levels as you can afford.' },
    b2: { name: 'Auto-buyer', icon: 'A', max: 1, cost: [6], desc: 'Automatically buys the cheapest affordable upgrade (toggle in the panel).' },
    b3: { name: 'Magnet Memory', icon: 'M', max: 1, cost: [3], desc: 'The field keeps working for 1 s after the cursor leaves the board.' },
    b4: { name: 'Auto-pulse', icon: '⟳', max: 1, cost: [8], desc: 'Pulse fires on its own when 5+ coins are in range.' },
    b5: { name: 'Homing Prisms', icon: '◇→', max: 1, cost: [4], desc: 'Prism coins slowly steer toward your magnet from anywhere on the board.' },
    b6: { name: 'Auto-shift', icon: '⇄', max: 1, cost: [12], desc: 'Shift polarity automatically when a run reaches a target you set.' },
    key: { name: 'Drones', icon: '✦', max: 3, cost: [12, 18, 24], desc: 'KEYSTONE · An autonomous magnet roams the board (+1 per level).' },
  }),
];
const BY_ID = Object.fromEntries(NODES.map(n => [n.id, n]));

/* ---------- mockup state ---------- */
const run = { earned: 1_240_000, shiftNo: 1 };
const coresFor = earned => Math.floor(10 * Math.sqrt(earned / 1e6));
const ui = { screen: 'tree', cores: 12, lv: { core: 1 }, cam: { x: 0, y: 0, z: 0.8 }, mouse: null, drag: null, hover: null, flashes: [], anim: null, t: 0, gain: 0 };

/* Tree modes: 'shift' = opened by Shift Polarity, Cores from this run can be spent (choices are tentative until confirmed);
               'browse' = mid-run preview (from 100k earned), look only. */
ui.mode = 'shift';
ui.banked = 0;                            // Cores left over from earlier shifts
ui.pending = coresFor(run.earned);        // Cores this shift will give
ui.snapshot = { lv: { core: 1 }, cores: ui.banked };
ui.inShift = true; // a shift session is open (Cores of this run added, choices tentative)
function openShiftTree() {
  if (!ui.inShift) { ui.snapshot = { lv: { ...ui.lv }, cores: ui.cores }; ui.cores += ui.pending; ui.gain = ui.pending; ui.inShift = true; }
  ui.mode = 'shift'; setScreen('tree');
}
function openBrowse() { if (ui.inShift) cancelShift(); ui.mode = 'browse'; setScreen('tree'); }
function undoChoices() { ui.lv = { ...ui.snapshot.lv }; ui.cores = ui.snapshot.cores + ui.pending; }
function cancelShift() { ui.lv = { ...ui.snapshot.lv }; ui.cores = ui.snapshot.cores; ui.gain = 0; ui.inShift = false; setScreen('ready'); }
function finishShift() { ui.inShift = false; ui.gain = 0; run.shiftNo++; ui.mode = 'browse'; setScreen('progress'); } // new run starts
const spentThisShift = () => ui.snapshot.cores + ui.pending - ui.cores;
const boughtThisShift = () => NODES.filter(n => (ui.lv[n.id] || 0) > (ui.snapshot.lv[n.id] || 0)).length;

// start in the shift tree with the Cores of this run
ui.cores = ui.banked + ui.pending; ui.gain = ui.pending;
// ?demo=1 starts with some Cores already placed; ?s=progress|ready|tree|confirm picks the screen
const params = new URLSearchParams(location.search);
if (params.get('demo')) { ui.lv = { core: 1, Nb1: 1, Nb2: 1, Eb1: 1, Sb1: 2, Wb1: 1 }; ui.cores = ui.banked + ui.pending - 9; }

const owned = n => (ui.lv[n.id] || 0) > 0;
const visible = n => n.id === 'core' || n.from.some(p => owned(BY_ID[p]));
const nextCost = n => n.cost[ui.lv[n.id] || 0];
const maxed = n => (ui.lv[n.id] || 0) >= n.max;
const canBuy = n => ui.mode === 'shift' && visible(n) && !maxed(n) && ui.cores >= nextCost(n);
const nodeR = n => (n.key ? 25 : 17);
const toScreen = (x, y) => ({ x: W / 2 + (x - ui.cam.x) * ui.cam.z, y: H / 2 + (y - ui.cam.y) * ui.cam.z });
const toWorld = (x, y) => ({ x: (x - W / 2) / ui.cam.z + ui.cam.x, y: (y - H / 2) / ui.cam.z + ui.cam.y });

/* ---------- Screen 1/2: run with Polarity Shift ready ---------- */
const B = { x: 16, y: 16, w: 700, h: 446 }, PB = { x: 16, y: 472, w: 700, h: 52 }, P = { x: 732, y: 16, w: 212, h: 508 };
const SHIFT_BTN = { x: PB.x + PB.w - 196, y: PB.y + 12, w: 180, h: 28 };
function drawRunScreen() {
  const t = ui.t;
  // board
  ctx.fillStyle = '#070a1a'; ctx.beginPath(); ctx.roundRect(B.x, B.y, B.w, B.h, 10); ctx.fill();
  ctx.save(); ctx.clip();
  ctx.strokeStyle = 'rgba(0,240,255,.07)'; ctx.lineWidth = 1; ctx.beginPath();
  for (let x = B.x; x < B.x + B.w; x += 28) { ctx.moveTo(x + .5, B.y); ctx.lineTo(x + .5, B.y + B.h); }
  for (let y = B.y; y < B.y + B.h; y += 28) { ctx.moveTo(B.x, y + .5); ctx.lineTo(B.x + B.w, y + .5); }
  ctx.stroke();
  for (let i = 0; i < 9; i++) { // a few drifting coins
    const x = B.x + ((i * 173 + t * 40 * (i % 2 ? 1 : -1)) % B.w + B.w) % B.w, y = B.y + 60 + (i * 97) % (B.h - 120);
    glow(C.cyan, 12); ctx.strokeStyle = C.cyan; ctx.lineWidth = 1.6; hex(x, y, 11.9, t + i); ctx.stroke(); noGlow();
  }
  ctx.fillStyle = 'rgba(95,155,179,.7)'; ctx.font = `11px ${FONT}`; ctx.fillText('RUN 18:42   CATCH 74%   MISSED 4,821   BEST COMBO 1,320', B.x + 12, B.y + 22);
  ctx.restore();
  glow(C.cyan, 12); ctx.strokeStyle = C.cyan; ctx.beginPath(); ctx.roundRect(B.x + .5, B.y + .5, B.w - 1, B.h - 1, 10); ctx.stroke(); noGlow();

  // panel stub
  glow(C.cyan, 10); ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(P.x, P.y, P.w, P.h, 10); ctx.fill(); ctx.strokeStyle = C.cyan; ctx.stroke(); noGlow();
  ctx.fillStyle = C.text; ctx.font = `600 22px ${FONT}`; ctx.fillText('312,450', P.x + 42, P.y + 40);
  ctx.fillStyle = C.magenta; ctx.font = `700 11px ${FONT}`; ctx.fillText('UPGRADES', P.x + 16, P.y + 86);
  for (let i = 0; i < 7; i++) { ctx.fillStyle = 'rgba(0,229,255,.05)'; ctx.beginPath(); ctx.roundRect(P.x + 10, P.y + 96 + i * 58, P.w - 20, 54, 7); ctx.fill(); }

  if (ui.screen === 'progress') { drawProgressBar(); return; }
  // prestige bar – READY state
  const pulse = .5 + .5 * Math.sin(t * 4);
  ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(PB.x, PB.y, PB.w, PB.h, 10); ctx.fill();
  glow(C.magenta, 8 + pulse * 10); ctx.strokeStyle = C.magenta; ctx.lineWidth = 1.2; ctx.stroke(); noGlow();
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.magenta; ctx.font = `700 11px ${FONT}`; ctx.fillText('POLARITY SHIFT · READY', PB.x + 16, PB.y + 18);
  ctx.fillStyle = C.sub; ctx.font = `11px ${FONT}`; ctx.fillText(`Earned 1.24M · shift now for`, PB.x + 16, PB.y + 35);
  ctx.fillStyle = C.core; ctx.font = `700 12px ${FONT}`; ctx.fillText(`+${coresFor(run.earned)} ◆ CORES`, PB.x + 228, PB.y + 35);
  ctx.fillStyle = C.sub; ctx.font = `10px ${FONT}`; ctx.fillText('next Core at 1.44M', PB.x + 340, PB.y + 35);
  // shift button
  const b = SHIFT_BTN, hover = ui.mouse && inR(ui.mouse, b);
  glow(C.magenta, hover ? 22 : 10 + pulse * 8);
  ctx.fillStyle = hover ? 'rgba(255,43,214,.3)' : 'rgba(255,43,214,.14)'; ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill();
  ctx.strokeStyle = C.magenta; ctx.lineWidth = 1.5; ctx.stroke(); noGlow();
  ctx.fillStyle = '#ffd0f5'; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('SHIFT POLARITY  [P]', b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}
const inR = (p, r) => p.x >= r.x && p.x <= r.x + r.w && p.y >= r.y && p.y <= r.y + r.h;

/* prestige bar mid-run (≥ 100k earned): progress + a button to browse the Core tree */
const TREE_BTN = { x: PB.x + PB.w - 156, y: PB.y + 12, w: 140, h: 28 };
function drawProgressBar() {
  const earned = 340_000, prog = earned / 1e6;
  ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(PB.x, PB.y, PB.w, PB.h, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(0,229,255,.35)'; ctx.lineWidth = 1; ctx.setLineDash([5, 5]); ctx.stroke(); ctx.setLineDash([]);
  ctx.textBaseline = 'middle';
  ctx.fillStyle = C.magenta; ctx.font = `700 11px ${FONT}`; ctx.fillText('POLARITY SHIFT', PB.x + 16, PB.y + 18);
  ctx.fillStyle = C.sub; ctx.font = `11px ${FONT}`; ctx.fillText('Earn 1M this run · 340.0k', PB.x + 16, PB.y + 35);
  const bx = PB.x + 230, bw = 260, by = PB.y + PB.h / 2 - 4;
  ctx.fillStyle = 'rgba(0,229,255,.08)'; ctx.beginPath(); ctx.roundRect(bx, by, bw, 8, 4); ctx.fill();
  glow(C.magenta, 8); ctx.fillStyle = C.magenta; ctx.beginPath(); ctx.roundRect(bx, by, bw * prog, 8, 4); ctx.fill(); noGlow();
  const b = TREE_BTN, hover = ui.mouse && inR(ui.mouse, b);
  glow(C.core, hover ? 16 : 6); ctx.fillStyle = hover ? 'rgba(185,140,255,.22)' : 'rgba(185,140,255,.08)';
  ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill(); ctx.strokeStyle = C.core; ctx.lineWidth = 1.2; ctx.stroke(); noGlow();
  ctx.fillStyle = C.core; ctx.font = `700 11px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText('◆ CORE TREE  [T]', b.x + b.w / 2, b.y + b.h / 2 + 1);
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

/* ---------- Screen 3: confirm modal, shown over the Core tree after the player has placed their Cores ---------- */
const M = { x: 250, y: 100, w: 460, h: 330 };
const BTN_OK = { x: M.x + 30, y: M.y + M.h - 58, w: 190, h: 34 }, BTN_NO = { x: M.x + M.w - 220, y: M.y + M.h - 58, w: 190, h: 34 };
function drawConfirm() {
  drawTree();
  ctx.fillStyle = 'rgba(2,3,10,.72)'; ctx.fillRect(0, 0, W, H);
  glow(C.magenta, 22); ctx.fillStyle = C.panel; ctx.beginPath(); ctx.roundRect(M.x, M.y, M.w, M.h, 12); ctx.fill();
  ctx.strokeStyle = C.magenta; ctx.lineWidth = 1.2; ctx.stroke(); noGlow();
  ctx.textAlign = 'center';
  glow(C.magenta, 14); ctx.fillStyle = C.magenta; ctx.font = `700 20px ${FONT}`; ctx.fillText('SHIFT POLARITY?', M.x + M.w / 2, M.y + 40); noGlow();
  ctx.fillStyle = C.core; ctx.font = `700 24px ${FONT}`; glow(C.core, 14); ctx.fillText(`+${ui.pending} ◆ earned this run`, M.x + M.w / 2, M.y + 78); noGlow();
  ctx.fillStyle = C.text; ctx.font = `12px ${FONT}`;
  ctx.fillText(`Spent ${spentThisShift()} ◆ on ${boughtThisShift()} node${boughtThisShift() === 1 ? '' : 's'} · ${ui.cores} ◆ saved for later`, M.x + M.w / 2, M.y + 104);
  ctx.fillStyle = C.sub; ctx.font = `10px ${FONT}`; ctx.fillText('Cores = 10 × √(earned this run ÷ 1M), rounded down', M.x + M.w / 2, M.y + 124);
  ctx.textAlign = 'left';
  const col = (x, title, color, items) => {
    ctx.fillStyle = color; ctx.font = `700 11px ${FONT}`; ctx.fillText(title, x, M.y + 156);
    ctx.fillStyle = C.text; ctx.font = `11px ${FONT}`; items.forEach((s, i) => ctx.fillText('· ' + s, x, M.y + 176 + i * 17));
  };
  col(M.x + 30, 'RESETS', C.red, ['Coins', 'Upgrade levels', 'Unlocks & mini-goals', 'Run stats']);
  col(M.x + 250, 'YOU KEEP', C.cyan, ['Cores & Core tree', 'Lifetime stats', 'Settings']);
  for (const [b, label, color] of [[BTN_OK, 'SHIFT & START RUN', C.magenta], [BTN_NO, 'BACK TO TREE', C.sub]]) {
    const hover = ui.mouse && inR(ui.mouse, b);
    if (b === BTN_OK) glow(C.magenta, hover ? 20 : 8);
    ctx.fillStyle = b === BTN_OK ? (hover ? 'rgba(255,43,214,.32)' : 'rgba(255,43,214,.16)') : (hover ? 'rgba(95,155,179,.15)' : 'transparent');
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill(); ctx.strokeStyle = color; ctx.lineWidth = 1.3; ctx.stroke(); noGlow();
    ctx.fillStyle = b === BTN_OK ? '#ffd0f5' : C.sub; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
}

/* ---------- Shift animation: the field flips polarity, starting from the Core, then the new run begins ---------- */
function drawShiftAnim() {
  const k = ui.anim.t / ui.anim.dur, c = toScreen(0, 0), cx = c.x, cy = c.y;
  drawTree();
  ctx.save(); ctx.globalCompositeOperation = 'difference'; ctx.fillStyle = `rgba(255,255,255,${Math.min(1, k * 2) * .9})`; ctx.fillRect(0, 0, W, H); ctx.restore();
  for (const [off, col] of [[0, C.magenta], [.15, C.cyan], [.3, C.core]]) {
    const kk = Math.max(0, k - off) / (1 - off); if (kk <= 0) continue;
    glow(col, 20); ctx.strokeStyle = col; ctx.lineWidth = 3 * (1 - kk) + 1; ctx.globalAlpha = 1 - kk;
    ctx.beginPath(); ctx.arc(cx, cy, kk * 1100, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; noGlow();
  }
  if (k > .55) { ctx.fillStyle = `rgba(4,5,12,${(k - .55) / .45})`; ctx.fillRect(0, 0, W, H); }
}

/* ---------- Screen 2: Core tree ---------- */
function drawTree() {
  const t = ui.t;
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  // pole glows + labels
  for (const k of ['N', 'E', 'S', 'W']) { // a soft glow toward each compass direction + a big faint letter past the keystone
    const [u] = AXES[k], col = POLE[k], s = u[1] ? VERTICAL_SQUEEZE : 1;
    const p = toScreen(u[0] * 420 * s, u[1] * 420 * s), r = 300 * ui.cam.z;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, r); g.addColorStop(0, col + '20'); g.addColorStop(1, col + '00');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const l = toScreen(u[0] * 540 * s, u[1] * 540 * s);
    ctx.fillStyle = col + '22'; ctx.font = `700 ${Math.round(110 * ui.cam.z)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k, l.x, l.y);
    ctx.fillStyle = col + '55'; ctx.font = `700 ${Math.round(13 * ui.cam.z)}px ${FONT}`;
    ctx.fillText(POLE_SHORT[k].toUpperCase(), l.x, l.y + 70 * ui.cam.z);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  }
  // field lines: concentric rings around the core
  const c0 = toScreen(0, 0);
  ctx.strokeStyle = 'rgba(185,140,255,.06)'; ctx.lineWidth = 1;
  for (let r = 90; r < 700; r += 90) { ctx.beginPath(); ctx.arc(c0.x, c0.y, r * ui.cam.z, 0, Math.PI * 2); ctx.stroke(); }

  // edges
  for (const n of NODES) {
    if (!n.from || !visible(n)) continue;
    for (const pid of n.from) {
      const p = BY_ID[pid]; if (!owned(p)) continue;
      const a = toScreen(p.x, p.y), b = toScreen(n.x, n.y), col = POLE[n.pole], on = owned(n);
      ctx.strokeStyle = on ? col : col + '55'; ctx.lineWidth = on ? 2.2 : 1.2;
      if (on) glow(col, 10); else { ctx.setLineDash([5, 5]); ctx.lineDashOffset = -t * 20; }
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke(); ctx.setLineDash([]); noGlow();

    ctx.fillStyle = lv ? '#fff' : buyable ? col : col + '99';
    ctx.font = `700 ${Math.round((n.key ? 15 : 12) * ui.cam.z)}px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(n.icon, p.x, p.y + 1);

      const yy = p.y + r + 9 * ui.cam.z;

        ctx.fillStyle = i < lv ? col : col + '33'; ctx.beginPath();
        ctx.arc(p.x + (i - (n.max - 1) / 2) * 7 * ui.cam.z, yy, 2.2 * ui.cam.z, 0, Math.PI * 2); ctx.fill();
      }
      if (!maxed(n)) {
        ctx.fillStyle = ui.cores >= nextCost(n) ? C.core : C.sub; ctx.font = `${Math.round(10 * ui.cam.z)}px ${FONT}`;
        ctx.fillText(`${nextCost(n)} ◆`, p.x, yy + (n.max > 1 ? 11 : 2) * ui.cam.z);

    const p = toScreen(f.x, f.y), k = 1 - f.life / .5;
    glow(f.col, 16); ctx.strokeStyle = f.col; ctx.globalAlpha = 1 - k; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(p.x, p.y, (20 + k * 50) * ui.cam.z, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; noGlow();

}
const START_BTN = { x: W - 216, y: H - 50, w: 200, h: 34 }, RESET_BTN = { x: W - 316, y: H - 50, w: 92, h: 34 }, BACK_BTN = { x: W - 436, y: H - 50, w: 112, h: 34 };
const BROWSE_BACK_BTN = { x: W - 216, y: H - 50, w: 200, h: 34 };
function treeButtons() { // [rect, label, primary, action]
  if (ui.mode === 'browse') return [[BROWSE_BACK_BTN, '◀  BACK TO RUN', true, () => setScreen('progress')]];
  return [
    [START_BTN, 'SHIFT & START RUN  ▶', true, () => setScreen('confirm')],
    [RESET_BTN, 'UNDO', false, undoChoices],
    [BACK_BTN, '◀  NOT YET', false, cancelShift],
  ];
}
function drawTreeHud() {
  // top bar
  ctx.fillStyle = 'rgba(8,12,30,.85)'; ctx.fillRect(0, 0, W, 44);
  ctx.strokeStyle = 'rgba(185,140,255,.35)'; ctx.beginPath(); ctx.moveTo(0, 44.5); ctx.lineTo(W, 44.5); ctx.stroke();
  ctx.textBaseline = 'middle';
  glow(C.magenta, 10); ctx.fillStyle = C.magenta; ctx.font = `700 15px ${FONT}`; ctx.fillText('POLARITY SHIFT', 18, 22); noGlow();
  ctx.fillStyle = C.sub; ctx.font = `11px ${FONT}`;
  if (ui.mode === 'browse') {
    ctx.fillText('CORE TREE · PREVIEW', 170, 23);
    ctx.fillStyle = C.core; ctx.fillText('Reach 1M and shift to spend Cores here', 340, 23);
  } else {
    ctx.fillText(`CORE TREE · shift #${run.shiftNo}`, 170, 23);
    ctx.fillStyle = C.core; ctx.font = `700 12px ${FONT}`; ctx.fillText(`+${ui.gain} ◆ from this run`, 330, 23);
    ctx.fillStyle = C.sub; ctx.font = `10px ${FONT}`; ctx.fillText('choices are final only after you confirm', 500, 23);
  }
  ctx.textAlign = 'right'; glow(C.core, 12); ctx.fillStyle = C.core; ctx.font = `700 18px ${FONT}`; ctx.fillText(`◆ ${ui.cores}`, W - 82, 22); noGlow();
  ctx.fillStyle = C.sub; ctx.font = `11px ${FONT}`; ctx.fillText('CORES', W - 18, 23); ctx.textAlign = 'left';
  // legend: a small compass rose (N up) with the branch names
  const cx = 52, cy = H - 52, R = 30;
  ctx.fillStyle = 'rgba(8,12,30,.85)'; ctx.beginPath(); ctx.roundRect(10, H - 126, 230, 118, 10); ctx.fill();
  ctx.strokeStyle = 'rgba(185,140,255,.2)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.strokeStyle = 'rgba(185,140,255,.25)'; ctx.beginPath(); ctx.arc(cx, cy, R * .55, 0, Math.PI * 2); ctx.stroke();
  for (const k of ['N', 'E', 'S', 'W']) {
    const [u, v] = AXES[k], col = POLE[k], tip = { x: cx + u[0] * R, y: cy + u[1] * R };
    glow(col, 6); ctx.fillStyle = col; ctx.beginPath(); // arrow-shaped arm
    ctx.moveTo(tip.x, tip.y); ctx.lineTo(cx + v[0] * 4, cy + v[1] * 4); ctx.lineTo(cx - v[0] * 4, cy - v[1] * 4); ctx.closePath(); ctx.fill(); noGlow();
    ctx.font = `700 9px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(k, cx + u[0] * (R + 8), cy + u[1] * (R + 8));
  }
  ctx.textAlign = 'left';
  ['N', 'E', 'S', 'W'].forEach((k, i) => {
    const y = H - 79 + i * 17;
    ctx.fillStyle = POLE[k]; ctx.font = `700 11px ${FONT}`; ctx.fillText(k, 100, y);
    ctx.fillStyle = C.text; ctx.font = `11px ${FONT}`; ctx.fillText(POLE_SHORT[k], 116, y);
  });
  ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(95,155,179,.75)'; ctx.font = `9px ${FONT}`;
  ctx.fillText(ui.mode === 'browse' ? 'drag · scroll to zoom · hover for details' : 'drag · scroll to zoom · click to buy', 20, H - 112);
  ctx.fillText('new nodes appear next to owned ones', 20, H - 100);
  // buttons
  for (const [b, label, primary] of treeButtons()) {
    const hover = ui.mouse && inR(ui.mouse, b), col = primary ? C.cyan : C.sub;
    if (primary) glow(C.cyan, hover ? 20 : 10);
    ctx.fillStyle = primary ? (hover ? 'rgba(0,240,255,.25)' : 'rgba(0,240,255,.1)') : (hover ? 'rgba(95,155,179,.15)' : 'rgba(8,12,30,.8)');
    ctx.beginPath(); ctx.roundRect(b.x, b.y, b.w, b.h, 7); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.stroke(); noGlow();
    ctx.fillStyle = col; ctx.font = `700 12px ${FONT}`; ctx.textAlign = 'center'; ctx.fillText(label, b.x + b.w / 2, b.y + b.h / 2 + 1); ctx.textAlign = 'left';
  }

}
function drawNodeTip(n) {
  const lv = ui.lv[n.id] || 0, col = POLE[n.pole], w = 250;
  ctx.font = `11px ${FONT}`;
  const lines = wrap(n.desc, w - 24), h = 66 + lines.length * 15;
  let x = ui.mouse.x + 18, y = ui.mouse.y + 14;
  if (x + w > W - 8) x = ui.mouse.x - w - 18; if (y + h > H - 8) y = H - h - 8;
  glow(col, 12); ctx.fillStyle = 'rgba(8,12,30,.97)'; ctx.beginPath(); ctx.roundRect(x, y, w, h, 8); ctx.fill(); ctx.strokeStyle = col; ctx.lineWidth = 1; ctx.stroke(); noGlow();
  ctx.textBaseline = 'top';
  ctx.fillStyle = col; ctx.font = `700 12px ${FONT}`; ctx.fillText(n.name.toUpperCase(), x + 12, y + 10);
  ctx.fillStyle = C.sub; ctx.font = `10px ${FONT}`; ctx.fillText(POLE_NAME[n.pole], x + 12, y + 27);
  ctx.fillStyle = C.text; ctx.font = `11px ${FONT}`; lines.forEach((l, i) => ctx.fillText(l, x + 12, y + 44 + i * 15));
  const preview = ui.mode === 'browse';
  const foot = n.id === 'core' ? 'Always active' : maxed(n) ? `MAX · Lv ${lv}/${n.max}`
    : `Lv ${lv}/${n.max} · next: ${nextCost(n)} ◆${preview ? ' (spend after shifting)' : ui.cores < nextCost(n) ? ' (not enough Cores)' : ''}`;
  ctx.fillStyle = maxed(n) || n.id === 'core' ? col : preview ? C.sub : ui.cores >= nextCost(n) ? C.core : C.red; ctx.font = `700 10px ${FONT}`;
  ctx.fillText(foot, x + 12, y + h - 18); ctx.textBaseline = 'alphabetic';
}
function nodeAt(p) {
  const w = toWorld(p.x, p.y);
  return NODES.find(n => visible(n) && Math.hypot(n.x - w.x, n.y - w.y) < nodeR(n) + 4) || null;
}

/* ---------- input ---------- */
function setScreen(s) { ui.screen = s; document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.s === s)); }
function goTo(s) { // tab navigation
  if (s === 'progress') { if (ui.inShift) cancelShift(); ui.mode = 'browse'; setScreen('progress'); }
  else if (s === 'ready') { if (ui.inShift) cancelShift(); else setScreen('ready'); }
  else { openShiftTree(); if (s === 'confirm') setScreen('confirm'); }
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => goTo(b.dataset.s));
if (['progress', 'ready', 'tree', 'confirm'].includes(params.get('s'))) goTo(params.get('s'));
if (params.get('s') === 'browse') openBrowse();
const pos = e => { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
cv.addEventListener('mousedown', e => { ui.drag = { start: pos(e), cam: { ...ui.cam }, moved: false }; });
window.addEventListener('mouseup', e => {
  const d = ui.drag; ui.drag = null; if (!d || d.moved) return;
  const p = pos(e);
  if (ui.screen === 'progress' && inR(p, TREE_BTN)) openBrowse();
  else if (ui.screen === 'ready' && inR(p, SHIFT_BTN)) openShiftTree();
  else if (ui.screen === 'confirm' && inR(p, BTN_NO)) setScreen('tree');
  else if (ui.screen === 'confirm' && inR(p, BTN_OK)) { ui.anim = { t: 0, dur: 1.1 }; setScreen('anim'); }
  else if (ui.screen === 'tree') {
    const btn = treeButtons().find(([r]) => inR(p, r));
    if (btn) { btn[3](); return; }
    const n = nodeAt(p);
    if (n && canBuy(n)) { ui.cores -= nextCost(n); ui.lv[n.id] = (ui.lv[n.id] || 0) + 1; ui.flashes.push({ x: n.x, y: n.y, life: .5, col: POLE[n.pole] }); }
  }
});
cv.addEventListener('mousemove', e => {
  const p = pos(e); ui.mouse = p;
  if (ui.drag && ui.screen === 'tree') {
    const dx = p.x - ui.drag.start.x, dy = p.y - ui.drag.start.y;
    if (Math.hypot(dx, dy) > 4) ui.drag.moved = true;
    if (ui.drag.moved) { ui.cam.x = ui.drag.cam.x - dx / ui.cam.z; ui.cam.y = ui.drag.cam.y - dy / ui.cam.z; }
  }
  ui.hover = ui.screen === 'tree' && p.y > 44 ? nodeAt(p) : null;
  const btn = (ui.screen === 'progress' && inR(p, TREE_BTN)) || (ui.screen === 'ready' && inR(p, SHIFT_BTN)) ||
    (ui.screen === 'confirm' && (inR(p, BTN_OK) || inR(p, BTN_NO))) ||
    (ui.screen === 'tree' && (treeButtons().some(([r]) => inR(p, r)) || (ui.hover && canBuy(ui.hover))));
  cv.style.cursor = btn ? 'pointer' : ui.screen === 'tree' ? (ui.drag?.moved ? 'grabbing' : 'grab') : 'default';
});
cv.addEventListener('mouseleave', () => { ui.mouse = null; ui.hover = null; });
cv.addEventListener('wheel', e => {
  if (ui.screen !== 'tree') return; e.preventDefault();
  const p = pos(e), before = toWorld(p.x, p.y);
  ui.cam.z = Math.min(1.8, Math.max(.55, ui.cam.z * (e.deltaY < 0 ? 1.1 : 1 / 1.1)));
  const after = toWorld(p.x, p.y); ui.cam.x += before.x - after.x; ui.cam.y += before.y - after.y;
}, { passive: false });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === 'p' && ui.screen === 'ready') openShiftTree();
  if (k === 't' && ui.screen === 'progress') openBrowse();
  if (k === 'escape' && ui.screen === 'tree' && ui.mode === 'browse') setScreen('progress');
});

/* ---------- loop ---------- */
let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now; ui.t += dt;
  for (const f of ui.flashes) f.life -= dt; ui.flashes = ui.flashes.filter(f => f.life > 0);
  if (ui.screen === 'anim') {
    ui.anim.t += dt;

  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);
  if (ui.screen === 'ready' || ui.screen === 'progress') drawRunScreen();

requestAnimationFrame(frame);
